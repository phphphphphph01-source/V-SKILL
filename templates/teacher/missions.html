{% extends "base.html" %}{% block content %}<h1>Mission Builder</h1><div class="form-card"><form method="post"><input name="title" placeholder="Title" required><textarea name="scenario" placeholder="Scenario" required></textarea><input name="difficulty" type="number" min="1" max="5" value="1"><input name="time_limit" type="number" value="300"><select name="department_id">{% for d in departments %}<option value="{{d.id}}">{{d.name}}</option>{% endfor %}</select><select name="skills" multiple>{% for s in skills %}<option value="{{s.id}}">{{s.name}}</option>{% endfor %}</select><button class="btn">สร้าง Mission</button></form></div><div class="card">{% for m in missions %}<div class="fit"><span>{{m.title}}</span><form method="post" action="/teacher/missions/{{m.id}}/delete"><button>ลบ</button></form></div>{% endfor %}</div>{% endblock %}
