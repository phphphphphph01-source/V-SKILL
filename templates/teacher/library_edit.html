{% extends "base.html" %}
{% block title %} · Edit Library Article{% endblock %}
{% block content %}
<section class="teacher-library"><div class="section-title"><div><span class="eyebrow">CONTENT MANAGEMENT</span><h2>แก้ไขบทความ</h2></div></div>
<form class="content-form" method="post">
<label>ชื่อบทความ<input name="title" required minlength="5" maxlength="220" value="{{ article.title }}"></label><label>สรุปเนื้อหา<textarea name="summary" rows="3">{{ article.summary }}</textarea></label><label>เนื้อหา<textarea name="content" rows="14" required minlength="120">{{ article.content }}</textarea></label>
<div class="form-grid"><label>Department<select name="department_id" required>{% for d in departments %}<option value="{{ d.id }}" {% if d.id == article.department_id %}selected{% endif %}>{{ d.name }}</option>{% endfor %}</select></label><label>Category<select name="category_id" required>{% for c in categories %}<option value="{{ c.id }}" {% if c.id == article.category_id %}selected{% endif %}>{{ c.department.name }} · {{ c.name }}</option>{% endfor %}</select></label><label>ระดับ<select name="difficulty">{% for level in ['พื้นฐาน','กำลังพัฒนา','ประยุกต์','ท้าทาย'] %}<option {% if article.difficulty == level %}selected{% endif %}>{{ level }}</option>{% endfor %}</select></label><label>เวลาอ่าน<input name="estimated_minutes" type="number" min="1" max="180" value="{{ article.estimated_minutes }}"></label></div>
<label>Tags<input name="tags" value="{{ article.tags }}"></label><label>Learning Objectives<textarea name="learning_objectives" rows="3">{{ article.learning_objectives }}</textarea></label><label>Safety Notes<textarea name="safety_notes" rows="3">{{ article.safety_notes }}</textarea></label><label>Mini Challenge<textarea name="mini_challenge" rows="3">{{ article.mini_challenge }}</textarea></label><label>Cover Image URL<input name="cover_image" value="{{ article.cover_image }}"></label>
<label>Skills<select name="skill_ids" multiple size="6">{% for skill in skills %}<option value="{{ skill.id }}" {% if skill in article.skills %}selected{% endif %}>{{ skill.name }}</option>{% endfor %}</select></label><label>Related Missions<select name="mission_ids" multiple size="6">{% for mission in missions %}<option value="{{ mission.id }}" {% if mission in article.missions %}selected{% endif %}>{{ mission.department.name }} · {{ mission.title }}</option>{% endfor %}</select></label>
<button class="btn" type="submit">บันทึกการแก้ไข</button> <a class="btn" href="{{ url_for('teacher.library_manager') }}">ยกเลิก</a></form></section>
{% endblock %}
{% block scripts %}<style>.teacher-library{max-width:1100px;margin:0 auto;padding:30px 20px}.content-form{display:grid;gap:14px;border:1px solid var(--line);border-radius:22px;padding:22px;background:rgba(255,255,255,.03)}.content-form label{display:grid;gap:7px;color:#c8d4ef;font-size:12px}.content-form input,.content-form textarea,.content-form select{width:100%;box-sizing:border-box;background:#101a35;color:#fff;border:1px solid var(--line);border-radius:10px;padding:11px;font:inherit}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:600px){.form-grid{grid-template-columns:1fr}}</style>{% endblock %}
