{% extends "base.html" %}{% block content %}<div class="page-head"><div><span class="eyebrow">SKILL GROWTH</span><h1>พัฒนาการของคุณ 📈</h1><p>ทุกจุดคือหลักฐานจาก Mission ที่ทำจริง</p></div></div><div class="grid two">{% for x in rows %}<div class="card" data-tilt><span class="eyebrow">MISSION #{{x.attempt}}</span><h2>{{x.skill}}</h2><div class="score">{{x.score}}%</div><p>{{x.at}}</p><div class="progress-track"><i style="--value:{{x.score}}%"></i></div></div>{% else %}<div class="card">ยังไม่มีประวัติ</div>{% endfor %}</div>{% endblock %}
